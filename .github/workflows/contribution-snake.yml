name: Update contribution snake

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/contribution-snake.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake from redd1514's contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: redd1514
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#50CFE8
            dist/snake-dark.svg?palette=github-dark&color_snake=#50CFE8

      - name: Publish animated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

